version: "3.8"

services:
  # MESSAGING SYSTEM
  rabbitmq:
    image: rabbitmq:3-management
    container_name: quant_desk_queue
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-supersecretpassword}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # DATABASE
  postgres:
    image: postgres:15-alpine
    container_name: quant_desk_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-propdesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FRONTEND (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quant_desk_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@postgres:5432/${POSTGRES_DB:-propdesk}
    depends_on:
      - postgres
      - rabbitmq

  # DB VAULT WORKER (Bridge between RabbitMQ and Postgres)
  db_vault_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: db_vault_worker
    restart: always
    command: ["python", "db_vault_worker.py"]
    depends_on:
      - rabbitmq
      - postgres
    env_file:
      - .env

  # VECTOR AGENT (Linear Regression Engine)
  candle_vector_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: candle_vector_agent
    restart: always
    command: ["python", "candle_vector_agent.py"]
    depends_on:
      - rabbitmq
    env_file:
      - .env

  # SCRAPER: NSE FLOWS
  nse_flows_scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nse_flows_scraper
    restart: always
    command: ["python", "nse_flows_scraper.py"]
    depends_on:
      - rabbitmq
    env_file:
      - .env

  # SCRAPER: NSDL SECTOR
  nsdl_sector_scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nsdl_sector_scraper
    restart: always
    command: ["python", "nsdl_sector_scraper.py"]
    depends_on:
      - rabbitmq
    env_file:
      - .env

volumes:
  rabbitmq_data:
  postgres_data: